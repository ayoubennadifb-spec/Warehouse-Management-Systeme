services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portique_dev}
      POSTGRES_DB: ${POSTGRES_DB:-portique}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - portique_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portique}:${POSTGRES_PASSWORD:-portique_dev}@db:5432/${POSTGRES_DB:-portique}
      APP_MODE: simulation
    depends_on:
      db:
        condition: service_healthy
volumes:
  portique_data:
